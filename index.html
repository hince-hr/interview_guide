<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>면접 질문 가이드</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #F7F7F9;
  --surface: #FFFFFF;
  --surface2: #F2F2F6;
  --border: #E4E4EA;
  --border-light: #EBEBF0;
  --text-primary: #1A1A2E;
  --text-secondary: #5C5C7A;
  --text-muted: #9898B0;

  --perf: #7B61FF;
  --perf-light: #EEE9FF;
  --perf-mid: #C9BBFF;

  --rel: #18A87C;
  --rel-light: #E2F5EE;
  --rel-mid: #9BE0C8;

  --adapt: #2E7EE0;
  --adapt-light: #E3EEFF;
  --adapt-mid: #A0C2F5;

  --lead: #E0553A;
  --lead-light: #FDEEE9;
  --lead-mid: #F5B9A8;

  --q-main: #3D3D8F;
  --q-follow: #1A6B52;
  --q-target: #1B5A9A;

  --radius-sm: 6px;
  --radius: 10px;
  --radius-lg: 14px;
  --radius-xl: 18px;
  --shadow: 0 1px 4px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.04);
  --shadow-md: 0 2px 8px rgba(0,0,0,.08), 0 8px 24px rgba(0,0,0,.06);
}

body {
  font-family: 'Noto Sans KR', -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text-primary);
  min-height: 100vh;
  padding: 20px 16px 48px;
}

.wrap { max-width: 780px; margin: 0 auto; }

/* ── Header ── */
.header {
  margin-bottom: 20px;
}
.header-title {
  font-size: 22px;
  font-weight: 700;
  color: var(--text-primary);
  letter-spacing: -0.5px;
  margin-bottom: 4px;
}
.header-sub {
  font-size: 13px;
  color: var(--text-muted);
}

/* ── STAR Tip ── */
.tip-box {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  background: #FEFCE8;
  border: 1px solid #FDE68A;
  border-left: 3px solid #F59E0B;
  border-radius: var(--radius);
  padding: 11px 14px;
  margin-bottom: 20px;
}
.tip-icon { font-size: 15px; flex-shrink: 0; margin-top: 1px; }
.tip-text { font-size: 12.5px; color: #78350F; line-height: 1.7; }
.tip-text strong { font-weight: 600; color: #92400E; }

/* ── Search ── */
.search-wrap {
  position: relative;
  margin-bottom: 16px;
}
.search-icon {
  position: absolute;
  left: 13px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-muted);
  font-size: 15px;
  pointer-events: none;
}
.search-input {
  width: 100%;
  padding: 11px 40px 11px 40px;
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  font-size: 13.5px;
  font-family: inherit;
  background: var(--surface);
  color: var(--text-primary);
  outline: none;
  transition: border-color .15s;
}
.search-input::placeholder { color: var(--text-muted); }
.search-input:focus { border-color: var(--perf); }
.search-clear {
  position: absolute;
  right: 11px;
  top: 50%;
  transform: translateY(-50%);
  background: var(--surface2);
  border: none;
  border-radius: 50%;
  width: 20px; height: 20px;
  display: none;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 11px;
  color: var(--text-secondary);
}
.search-clear.visible { display: flex; }

/* ── Filter bar ── */
.filter-bar {
  display: flex;
  gap: 8px;
  margin-bottom: 10px;
  align-items: center;
}
.filter-label {
  font-size: 11px;
  font-weight: 600;
  color: var(--text-muted);
  letter-spacing: .06em;
  white-space: nowrap;
}

/* ── Tab groups ── */
.tab-section { margin-bottom: 6px; }
.tab-section-label {
  font-size: 10.5px;
  font-weight: 600;
  color: var(--text-muted);
  letter-spacing: .07em;
  text-transform: uppercase;
  margin-bottom: 6px;
}
.tabs {
  display: flex;
  gap: 5px;
  flex-wrap: wrap;
  margin-bottom: 16px;
}
.tab-group { display: flex; gap: 5px; flex-wrap: wrap; margin-bottom: 5px; }

.tab {
  padding: 6px 13px;
  border-radius: 99px;
  border: 1.5px solid var(--border);
  font-size: 12.5px;
  font-family: inherit;
  font-weight: 500;
  cursor: pointer;
  color: var(--text-secondary);
  background: var(--surface);
  transition: all .15s;
  white-space: nowrap;
}
.tab:hover { background: var(--surface2); border-color: #C8C8D8; }

/* category tabs */
.tab.cat-all.active  { background: #1A1A2E; border-color: #1A1A2E; color: #FFF; }
.tab.cat-perf.active { background: var(--perf-light); border-color: var(--perf); color: #4B2FCA; }
.tab.cat-rel.active  { background: var(--rel-light);  border-color: var(--rel);  color: #0B6147; }
.tab.cat-adapt.active{ background: var(--adapt-light);border-color: var(--adapt);color: #164E9A; }
.tab.cat-lead.active { background: var(--lead-light); border-color: var(--lead); color: #8A2A15; }

/* target tabs */
.tab.tgt.active {
  background: #1A1A2E;
  border-color: #1A1A2E;
  color: #FFF;
}

/* ── Divider ── */
.divider {
  height: 1px;
  background: var(--border-light);
  margin: 12px 0 16px;
}

/* ── Result count ── */
.result-info {
  font-size: 12px;
  color: var(--text-muted);
  margin-bottom: 12px;
  min-height: 18px;
}
.result-info span { color: var(--text-secondary); font-weight: 600; }

/* ── Cards ── */
.card-list { display: flex; flex-direction: column; gap: 8px; }

.card {
  background: var(--surface);
  border: 1.5px solid var(--border-light);
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow: var(--shadow);
  transition: box-shadow .15s;
}
.card:hover { box-shadow: var(--shadow-md); }

.card-header {
  display: flex;
  align-items: center;
  gap: 0;
  padding: 0;
  cursor: pointer;
  position: relative;
}

.cat-stripe {
  width: 4px;
  align-self: stretch;
  border-radius: 0;
  flex-shrink: 0;
}
.cat-stripe.perf { background: var(--perf); }
.cat-stripe.rel  { background: var(--rel); }
.cat-stripe.adapt{ background: var(--adapt); }
.cat-stripe.lead { background: var(--lead); }

.card-header-inner {
  flex: 1;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 13px 14px;
}
.card-header-inner:hover { background: var(--surface2); }

.card-name-badge {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}
.card-cat-dot {
  width: 8px; height: 8px;
  border-radius: 50%;
  flex-shrink: 0;
}
.card-cat-dot.perf { background: var(--perf); }
.card-cat-dot.rel  { background: var(--rel); }
.card-cat-dot.adapt{ background: var(--adapt); }
.card-cat-dot.lead { background: var(--lead); }

.card-name {
  font-size: 14.5px;
  font-weight: 700;
  color: var(--text-primary);
  min-width: 80px;
}
.card-cat-label {
  font-size: 10.5px;
  font-weight: 600;
  padding: 2px 7px;
  border-radius: 99px;
}
.card-cat-label.perf { background: var(--perf-light); color: var(--perf); }
.card-cat-label.rel  { background: var(--rel-light);  color: var(--rel); }
.card-cat-label.adapt{ background: var(--adapt-light);color: var(--adapt); }
.card-cat-label.lead { background: var(--lead-light); color: var(--lead); }

.card-def {
  font-size: 12.5px;
  color: var(--text-secondary);
  flex: 1;
  line-height: 1.5;
}
.card-arrow {
  font-size: 11px;
  color: var(--text-muted);
  transition: transform .2s;
  flex-shrink: 0;
  margin-left: 4px;
}
.card-arrow.open { transform: rotate(90deg); }

/* ── Card body ── */
.card-body {
  display: none;
  border-top: 1.5px solid var(--border-light);
}

/* question section */
.qs-block {
  padding: 14px 16px;
  border-bottom: 1px solid var(--border-light);
}
.qs-block:last-child { border-bottom: none; }

.qs-label {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .06em;
  padding: 3px 9px 3px 7px;
  border-radius: 99px;
  margin-bottom: 10px;
}
.qs-label.main   { background: #EEEDFD; color: var(--q-main); }
.qs-label.follow { background: #E2F5EE; color: var(--q-follow); }
.qs-label.target { background: var(--adapt-light); color: var(--q-target); }

.qs-label-dot {
  width: 5px; height: 5px;
  border-radius: 50%;
}
.main   .qs-label-dot { background: var(--q-main); }
.follow .qs-label-dot { background: var(--q-follow); }
.target .qs-label-dot { background: var(--q-target); }

.qrow {
  display: flex;
  gap: 9px;
  padding: 6px 0;
  border-bottom: 1px dashed var(--border-light);
  align-items: flex-start;
}
.qrow:last-child { border-bottom: none; padding-bottom: 2px; }

.qnum {
  font-size: 11px;
  font-weight: 700;
  color: var(--text-muted);
  min-width: 22px;
  padding-top: 2px;
  flex-shrink: 0;
}
.qtext {
  font-size: 13px;
  color: var(--text-primary);
  line-height: 1.7;
}
mark.highlight {
  background: #FEF08A;
  color: inherit;
  border-radius: 2px;
  padding: 0 1px;
}

/* target badges */
.badge-list { display: flex; flex-wrap: wrap; gap: 6px; padding-top: 2px; }
.badge {
  font-size: 12px;
  padding: 5px 11px;
  border-radius: 8px;
  background: var(--surface2);
  color: var(--text-secondary);
  border: 1px solid var(--border);
  font-weight: 500;
  line-height: 1.4;
}

/* ── Empty state ── */
.empty {
  text-align: center;
  padding: 48px 20px;
  color: var(--text-muted);
}
.empty-icon { font-size: 36px; margin-bottom: 10px; }
.empty-text { font-size: 14px; }

/* ── Search mode card (flat list) ── */
.card.search-hit { display: block !important; }
</style>
</head>
<body>
<div class="wrap">

  <!-- Header -->
  <div class="header">
    <div class="header-title">🎙 면접 질문 가이드</div>
    <div class="header-sub">역량별 경험면접 질문 카드 · 탭 선택 또는 검색으로 찾아보세요</div>
  </div>

  <!-- STAR Tip -->
  <div class="tip-box">
    <span class="tip-icon">💡</span>
    <span class="tip-text">답변이 추상적이면 <strong>"그 상황에서 본인이 구체적으로 어떤 행동을 했나요?"</strong> 로 꼬리질문 → <strong>STAR</strong>(상황 → 과제 → 행동 → 결과) 흐름으로 유도하세요.</span>
  </div>

  <!-- Search -->
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input class="search-input" id="searchInput" type="text" placeholder="역량명, 질문 내용으로 검색..." autocomplete="off">
    <button class="search-clear" id="searchClear">✕</button>
  </div>

  <!-- Filter: Category -->
  <div class="tab-section">
    <div class="tab-section-label">역량 카테고리 필터</div>
    <div class="tab-group" id="catTabs">
      <button class="tab cat-all"         data-cat="all">전체</button>
      <button class="tab cat-perf" data-cat="perf">🎯 성과역량</button>
      <button class="tab cat-rel"         data-cat="rel">🤝 관계역량</button>
      <button class="tab cat-adapt"       data-cat="adapt">🔄 적응역량</button>
      <button class="tab cat-lead"        data-cat="lead">🌟 리더십역량</button>
    </div>
  </div>

  <!-- Filter: Target audience -->
  <div class="tab-section">
    <div class="tab-section-label">추천 대상 필터</div>
    <div class="tab-group" id="tgtTabs">
      <button class="tab tgt" data-tgt="all">전체</button>
      <button class="tab tgt" data-tgt="신입">🌱 신입·주니어</button>
      <button class="tab tgt" data-tgt="경력">💼 경력직</button>
      <button class="tab tgt" data-tgt="리더">👑 리더·팀장급</button>
      <button class="tab tgt" data-tgt="전직군">✅ 전 직군 공통</button>
    </div>
  </div>

  <div class="divider"></div>
  <div class="result-info" id="resultInfo"></div>

  <!-- Card list -->
  <div class="card-list" id="cardList"></div>
  <div class="empty" id="emptyState" style="display:none">
    <div class="empty-icon">🔎</div>
    <div class="empty-text">검색 결과가 없습니다.</div>
  </div>

</div>

// ─── State ───────────────────────────────────────────────────────────────────
let activeCat = 'all';
let activeTgt = 'all';
let searchQuery = '';

// ─── Render ──────────────────────────────────────────────────────────────────
function escapeHtml(str) {
  return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function highlight(text, q) {
  if (!q) return escapeHtml(text);
  const safe = escapeHtml(text);
  const safeQ = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return safe.replace(new RegExp(safeQ, 'gi'), m => `<mark class="highlight">${m}</mark>`);
}

function tgtMatches(item) {
  if (activeTgt === 'all') return true;
  return item.tgtKeys && item.tgtKeys.includes(activeTgt);
}

function catMatches(item) {
  if (activeCat === 'all') return true;
  return item.cat === activeCat;
}

function searchMatches(item, q) {
  if (!q) return true;
  const lq = q.toLowerCase();
  if (item.name.toLowerCase().includes(lq)) return true;
  if (item.def.toLowerCase().includes(lq)) return true;
  if (item.main.some(x => x.toLowerCase().includes(lq))) return true;
  if (item.follow.some(x => x.toLowerCase().includes(lq))) return true;
  if (item.targets.some(x => x.toLowerCase().includes(lq))) return true;
  return false;
}

function render() {
  const list = document.getElementById('cardList');
  const empty = document.getElementById('emptyState');
  const info = document.getElementById('resultInfo');

  const q = searchQuery.trim();
  const filtered = DATA.filter(item => catMatches(item) && tgtMatches(item) && searchMatches(item, q));

  list.innerHTML = '';

  if (filtered.length === 0) {
    empty.style.display = 'block';
    info.innerHTML = '';
    return;
  }
  empty.style.display = 'none';

  // result info
  if (q || activeTgt !== 'all') {
    info.innerHTML = `<span>${filtered.length}개</span>의 역량이 검색되었습니다.`;
  } else {
    const catName = {perf:'성과역량', rel:'관계역량', adapt:'적응역량', lead:'리더십역량', all:'전체'}[activeCat];
    info.innerHTML = `<span>${catName}</span> · 총 <span>${filtered.length}개</span> 역량`;
  }

  filtered.forEach(item => {
    const card = document.createElement('div');
    card.className = 'card';

    // Build questions HTML
    const mainQs = item.main.map((q2, i) =>
      `<div class="qrow"><span class="qnum">Q${i+1}</span><span class="qtext">${highlight(q2, q)}</span></div>`
    ).join('');

    const followQs = item.follow.map(q2 =>
      `<div class="qrow"><span class="qnum">↳</span><span class="qtext">${highlight(q2, q)}</span></div>`
    ).join('');

    const badges = item.targets.map(t =>
      `<span class="badge">${highlight(t, q)}</span>`
    ).join('');

    // Show cat label only in 'all' cat view or search
    const showCat = activeCat === 'all' || q;

    card.innerHTML = `
      <div class="card-header" onclick="toggleCard(this)">
        <div class="cat-stripe ${item.cat}"></div>
        <div class="card-header-inner">
          <div class="card-name-badge">
            <span class="card-name">${highlight(item.name, q)}</span>
            ${showCat ? `<span class="card-cat-label ${item.cat}">${item.catLabel}</span>` : ''}
          </div>
          <span class="card-def">${highlight(item.def, q)}</span>
          <span class="card-arrow">▶</span>
        </div>
      </div>
      <div class="card-body">
        <div class="qs-block">
          <div class="qs-label main"><span class="qs-label-dot"></span>대표 질문</div>
          ${mainQs}
        </div>
        <div class="qs-block">
          <div class="qs-label follow"><span class="qs-label-dot"></span>꼬리 질문</div>
          ${followQs}
        </div>
        <div class="qs-block">
          <div class="qs-label target"><span class="qs-label-dot"></span>추천 대상</div>
          <div class="badge-list">${badges}</div>
        </div>
      </div>
    `;

    list.appendChild(card);
  });
}

// ─── Toggle card ─────────────────────────────────────────────────────────────
function toggleCard(header) {
  const body = header.nextElementSibling;
  const arrow = header.querySelector('.card-arrow');
  const isOpen = body.style.display === 'block';

  // Close all
  document.querySelectorAll('.card-body').forEach(b => b.style.display = 'none');
  document.querySelectorAll('.card-arrow').forEach(a => a.classList.remove('open'));

  if (!isOpen) {
    body.style.display = 'block';
    arrow.classList.add('open');
    // Smooth scroll into view
    setTimeout(() => header.closest('.card').scrollIntoView({behavior:'smooth', block:'nearest'}), 50);
  }
}

// ─── Tab handlers ─────────────────────────────────────────────────────────────
document.getElementById('catTabs').addEventListener('click', e => {
  const btn = e.target.closest('.tab');
  if (!btn) return;
  activeCat = btn.dataset.cat;
  document.querySelectorAll('#catTabs .tab').forEach(t => {
    const catKey = t.dataset.cat;
    t.className = 'tab ' + (catKey === 'all' ? 'cat-all' : `cat-${catKey}`);
  });
  btn.classList.add('active');
  render();
});

document.getElementById('tgtTabs').addEventListener('click', e => {
  const btn = e.target.closest('.tab');
  if (!btn) return;
  activeTgt = btn.dataset.tgt;
  document.querySelectorAll('#tgtTabs .tab').forEach(t => t.classList.remove('active'));
  btn.classList.add('active');
  render();
});

// ─── Search ───────────────────────────────────────────────────────────────────
const searchInput = document.getElementById('searchInput');
const searchClear = document.getElementById('searchClear');

searchInput.addEventListener('input', () => {
  searchQuery = searchInput.value;
  searchClear.classList.toggle('visible', !!searchQuery);
  // When searching, show all cats
  render();
});

searchClear.addEventListener('click', () => {
  searchInput.value = '';
  searchQuery = '';
  searchClear.classList.remove('visible');
  searchInput.focus();
  render();
});

// ─── Init ─────────────────────────────────────────────────────────────────────
render();
</script>
